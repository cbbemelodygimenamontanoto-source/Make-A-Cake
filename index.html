<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Atrapa los Ingredientes! 🎂</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #ffd6e8 0%, #e8d5f5 50%, #d5eaf5 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      box-shadow: 0 8px 40px rgba(255, 150, 180, 0.45);
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.7);
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>

  <script src="src/constants.js"></script>

  <script src="src/scenes/Start.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/InstructionsScene.js"></script>
  <script src="src/scenes/LevelsScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/GameOverScene.js"></script>

  <script src="src/main.js"></script>
</body>
</html>
